[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coal-mine-footprint"
version = "0.1.0"
description = "Ứng dụng tính toán dấu chân carbon cho mỏ than."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "pqhuy2013" }]
dependencies = ["streamlit>=1.40", "openpyxl>=3.1", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3"]

[project.urls]
Repository = "https://github.com/pqhuy2013/coal-mine-carbon-footprint"

[tool.hatch.build.targets.wheel]
packages = ["src/coal_mine_footprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
